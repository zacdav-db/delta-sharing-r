[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is a build-time Parquet transitive dependency; Delta Kernel 0.22/Arrow 57 cannot replace it" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is an unmaintained object_store GCP transitive dependency; vNext keeps profile and cloud authentication in R" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is pinned by object_store 0.12; vNext data URLs use bounded HTTP GET/range reads, not XML cloud/WebDAV listing APIs" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is pinned by object_store 0.12; vNext data URLs use bounded HTTP GET/range reads, not XML cloud/WebDAV listing APIs" },
]
git-fetch-with-cli = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
