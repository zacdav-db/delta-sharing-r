[package]
name = "delta_sharing_native"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "delta_sharing_native"
crate-type = ["staticlib"]

[dependencies]
arrow-array = { version = "=57.3.0", features = ["ffi"] }
arrow-schema = "=57.3.0"
delta_kernel = { version = "=0.22.0", default-features = false, features = [
  "arrow-57",
  "default-engine-rustls",
] }

[profile.release]
lto = "thin"
panic = "unwind"
strip = "debuginfo"
