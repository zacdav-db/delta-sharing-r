[package]
name = "delta_sharing_native"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "delta_sharing_native"
crate-type = ["staticlib"]

[dependencies]
arrow-array = { version = "=58.3.0", features = ["ffi"] }
arrow-schema = "=58.3.0"
delta_kernel = { version = "=0.26.0", default-features = false, features = [
  "arrow-58",
] }
delta_kernel_default_engine = { version = "=0.26.0", default-features = false, features = [
  "arrow-58",
  "rustls",
] }
same-file = "=1.0.6"
url = "=2.5.8"

[dev-dependencies]
parquet = { version = "=58.3.0", default-features = false, features = ["arrow", "snap"] }

[profile.release]
lto = "thin"
panic = "unwind"
strip = "debuginfo"
