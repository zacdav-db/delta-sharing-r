[package]
name = "delta_sharing_native"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "delta_sharing_native"
crate-type = ["staticlib"]

[dependencies]
arrow-array = { version = "=58.3.0", features = ["ffi"] }
arrow-schema = "=58.3.0"
delta_kernel = { version = "=0.26.0", default-features = false, features = [
  "arrow-58",
] }
# R owns the Sharing protocol and all remote I/O. The default engine is used
# only for its local Delta/Parquet implementation.
delta_kernel_default_engine = { version = "=0.26.0", default-features = false, features = [
  "arrow-58",
] }
url = "=2.5.8"

[profile.release]
lto = "thin"
panic = "unwind"
strip = "debuginfo"
