name: Package check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
  CARGO_TERM_COLOR: always
  R_KEEP_PKG_SOURCE: yes

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/rust -> ../../.cargo-target
          key: public-rust

      - name: Check formatting
        run: cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path src/rust/Cargo.toml
          --workspace
          --lib
          --all-features
          --locked
          --
          -D warnings

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check the minimum supported Rust version
        run: >-
          cargo +1.88.0 check
          --manifest-path src/rust/Cargo.toml
          --workspace
          --lib
          --all-features
          --locked

  source:
    name: Source package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          needs: check
          cache-version: 1

      - name: Test release tooling
        run: |
          python3 tools/test_configure.py
          python3 tools/test_rust_vendor.py
          python3 tools/test_dependency_licenses.py

      - name: Verify locked Rust sources
        run: |
          python3 tools/rust_vendor.py check
          python3 tools/dependency_licenses.py check

      - name: Build exact source package offline
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          R CMD build .

          shopt -s nullglob
          archives=(delta.sharing_*.tar.gz)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one source package." >&2
            exit 1
          fi

          contents="$(tar -tzf "${archives[0]}")"
          for required in \
            src/rust/vendor.tar.xz \
            src/rust/vendor-config.toml \
            inst/dependency-licenses/dependency-inventory.json \
            inst/dependency-licenses/rust-license-texts.tar.xz
          do
            if ! grep -Eq "/${required}$" <<<"$contents"; then
              echo "Source package is missing ${required}." >&2
              exit 1
            fi
          done
          if grep -Eq '/(\.cargo-target|src/(vendor|\.cargo|rust/target))/' <<<"$contents"; then
            echo "Source package contains an unpacked Rust build tree." >&2
            exit 1
          fi

          mkdir -p artifacts/source
          mv "${archives[0]}" artifacts/source/

      - name: Retain exact source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-source
          path: artifacts/source
          if-no-files-found: error
          retention-days: 7

  r:
    name: ${{ matrix.config.label }}
    needs: source
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-24.04
            r: devel
            label: Linux (R devel)
            http-user-agent: release
          - os: ubuntu-24.04
            r: release
            label: Linux (R release)
          - os: ubuntu-22.04
            r: "4.3"
            label: Linux (R minimum)
          - os: macos-15
            r: release
            label: macOS arm64 (R release)
          - os: macos-15-intel
            r: release
            label: macOS x86_64 (R release)
          - os: windows-2025
            r: release
            label: Windows x86_64 (R release)
            rust-target: x86_64-pc-windows-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.config.rust-target }}

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/rust -> ../../.cargo-target
          shared-key: r-package-release
          save-if: ${{ matrix.config.r == 'release' }}

      - name: Install R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - name: Download exact source package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-source
          path: artifacts/source

      - name: Run R CMD check
        env:
          CARGO_NET_OFFLINE: "true"
          _R_CHECK_CRAN_INCOMING_: "false"
          _R_CHECK_FORCE_SUGGESTS_: "false"
        shell: Rscript {0}
        run: |
          archive <- Sys.glob("artifacts/source/delta.sharing_*.tar.gz")
          if (length(archive) != 1L) {
            stop("Expected exactly one source package.")
          }
          rcmdcheck::rcmdcheck(
            archive,
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )

      - name: Show test output
        if: always()
        shell: bash
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Retain check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-check-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.r }}
          path: check
          if-no-files-found: ignore
          retention-days: 7
