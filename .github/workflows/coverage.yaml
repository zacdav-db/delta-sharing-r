name: Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r-coverage:
    name: R tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Enforce the clean vNext completion gate on the whole R implementation.
      DELTA_SHARING_MIN_COVERAGE: "90"
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect native sources
        id: native
        shell: bash
        run: |
          if [[ -f src/rust/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable Rust
        if: steps.native.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Restore Rust build cache
        if: steps.native.outputs.present == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/rust -> target
          key: r-coverage

      - name: Install R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install coverage dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::covr, any::roxygen2
          needs: coverage, documentation
          cache-version: 1

      - name: Verify generated documentation is current
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise(".", roclets = c("rd", "namespace"))
          status <- system2("git", c("diff", "--exit-code", "--", "DESCRIPTION", "NAMESPACE", "man"))
          if (status != 0L) {
            stop("Generated documentation is stale; run roxygen2::roxygenise()")
          }

      - name: Run tests and enforce R coverage
        run: Rscript tools/coverage.R

      - name: Retain R coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  publish-r-coverage:
    name: Publish R coverage
    needs: r-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download R coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r-coverage
          path: coverage

      - name: Upload R coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/cobertura.xml
          flags: r
          name: r-tests
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
